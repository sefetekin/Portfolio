<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- brushed-metal ring, like the scanner pad -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset=".3" stop-color="#8d9196"/>
      <stop offset=".5" stop-color="#e3e5e8"/>
      <stop offset=".72" stop-color="#5f646a"/>
      <stop offset="1" stop-color="#c9ccd0"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#14213a"/>
      <stop offset=".75" stop-color="#07090d"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#050506"/>
  <circle cx="32" cy="32" r="29" fill="url(#metal)"/>
  <circle cx="32" cy="32" r="23.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#3d8bff" stroke-width="1.6" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#3d8bff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="2.2 2.4"/>
  <path d="M24.5 19.5h15v5h-9.5v5h8v5h-8v5h9.5v5h-15z" fill="#eef4ff" filter="url(#glow)"/>
</svg>
